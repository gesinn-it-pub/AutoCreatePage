name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      matrix:
        include:
          - mw: "1.39"
            php: "8.1"
          - mw: "1.43"
            php: "8.3"
            coverage: true
          - mw: "1.46"
            php: "8.5"
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CI
        run: >
          make ci
          MW_VERSION=${{ matrix.mw }}
          PHP_VERSION=${{ matrix.php }}

      - name: Run coverage
        if: ${{ matrix.coverage }}
        run: >
          make ci-coverage
          MW_VERSION=${{ matrix.mw }}
          PHP_VERSION=${{ matrix.php }}

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/php/coverage.xml
