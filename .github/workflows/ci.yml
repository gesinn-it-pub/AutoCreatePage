name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-24.04
    # TODO: drop once AutoCreatePage is fixed for MW >= 1.39 (WikiPage::doEditContent()
    # removed, core classes moved into MediaWiki\... namespaces — see phpstan failures)
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        include:
          - mw: "1.39"
            php: "8.1"
            experimental: true
          - mw: "1.43"
            php: "8.3"
            coverage: true
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CI
        run: >
          make ci
          MW_VERSION=${{ matrix.mw }}
          PHP_VERSION=${{ matrix.php }}

      - name: Run coverage
        if: ${{ matrix.coverage }}
        run: >
          make ci-coverage
          MW_VERSION=${{ matrix.mw }}
          PHP_VERSION=${{ matrix.php }}

      - name: Upload coverage
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage/php/coverage.xml
